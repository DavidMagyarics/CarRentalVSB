server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: the app has a single HTML entry point and switches
    # between tabs with React state, not URL routing, but any direct/
    # refreshed request for an unknown path still falls back to
    # index.html instead of nginx's default 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
