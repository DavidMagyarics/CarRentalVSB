@startuml er-current
skinparam backgroundColor white

entity "BRANCH" as BRANCH {
  * id : int <<PK>>
  - -
  name : string
  address : string
}

entity "CAR" as CAR {
  * id : int <<PK>>
  - -
  brand : string
  model : string
  year : int
  license_plate : string
  daily_price : float
  hourly_price : float
  category : string
  transmission : string
  fuel_type : string
  seats : int
  description : string
  image_url : string
  branch_id : int <<FK>>
}

entity "USER" as USER {
  * id : int <<PK>>
  - -
  name : string
  email : string
  password_hash : string
  role : string "CUSTOMER | ADMIN"
}

entity "RESERVATION" as RESERVATION {
  * id : int <<PK>>
  - -
  car_id : int <<FK>>
  user_id : int <<FK>>
  status : string "DRAFT | CONFIRMED | CANCELLED"
  start_date : datetime
  end_date : datetime
  total_price : float
  payment_method : string "CASH | CARD"
  created_at : datetime
}

CAR ||- -o{ RESERVATION : "is reserved in"
USER ||- -o{ RESERVATION : "creates"
BRANCH ||- -o{ CAR : "is home to"
@enduml

