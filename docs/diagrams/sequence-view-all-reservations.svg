.9141,43.5,507.9141,39.5,503.9141" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="37.5" x2="308.5" y1="503.9141" y2="503.9141"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="229" x="49.5" y="516.981">table — car, customer, dates, price,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="253" x="49.5" y="532.1138">payment, status; buttons "Potvrdit" (UC</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="13" x="49.5" y="547.2466">8)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="117" x="49.5" y="562.3794">and "Zrušit" (UC5)</text><!--MD5=[bf6e4ba1bdb1dc38c8d44dc63ee87cb0]
@startuml sequence-view-all-reservations
skinparam backgroundColor white
skinparam responseMessageBelowArrow true
skinparam maxMessageSize 260
title Sequence — View all reservations (UC10)
actor Admin
boundary ":WebApp" as Web
control ":ReservationService" as Res
control ":AuthService" as Auth
database ":Database" as DB

Admin -> Web : showReservations() — "Všechny rezervace"
Web -> Res : get_reservations(token)\n[GET /reservations/]
Res -> Auth : require_admin(token)

alt not an admin
  Auth - -> Res : 403
  Res - -> Web : 403 "Vyžadována jsou práva administrátora"
else admin
  Auth - -> Res : admin : User
  Res -> DB : query(Reservation), newest first
  DB - -> Res : Reservation[] (every customer,\nwith car and customer)
  Res - -> Web : 200 OK Reservation[]
end

Web - -> Admin : table — car, customer, dates, price,\npayment, status; buttons "Potvrdit" (UC8)\nand "Zrušit" (UC5)
@enduml

