stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="380.5" x2="614.5" y1="720.6797" y2="720.6797"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="15" x="392.5" y="733.7466">ok</text><polygon fill="#A80036" points="118.5,745.8125,108.5,749.8125,118.5,753.8125,114.5,749.8125" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="112.5" x2="374.5" y1="749.8125" y2="749.8125"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="206" x="124.5" y="762.8794">200 OK r — the slot is free again</text><!--MD5=[1c4a7f25122b189915a8330023cc95c9]
@startuml sequence-cancel-reservation
skinparam backgroundColor white
skinparam responseMessageBelowArrow true
skinparam maxMessageSize 260
title Sequence — Cancel reservation (UC5)
actor "User\n(Customer or Admin)" as User
participant ":ReservationService" as Res
participant "u : User" as U
participant "r : Reservation" as R

User -> Res : cancel_reservation(id)\n[POST /reservations/{id}/cancel]
Res -> Res : get_reservation(id)
note right of Res
  r : Reservation (404 if it does not exist);
  u is the logged-in user (see UC6)
end note
Res -> R : get_user()
R - -> Res : owner
Res -> U : is_admin()
U - -> Res : true / false

alt u is not the owner and not an admin
  Res - -> User : 403 "Tato rezervace vám nepatří"
else owner or admin
  Res -> R : cancel()
  alt already CANCELLED
    R - -> Res : error
    Res - -> User : 409 "Rezervace je již zrušena"
  else CONFIRMED and the rental has already started
    R - -> Res : error
    Res - -> User : 409 "Potvrzenou rezervaci nelze zrušit\npoté, co již začal termín výpůjčky"
  else
    R -> R : status = CANCELLED
    R - -> Res : ok
    Res - -> User : 200 OK r — the slot is free again
  end
end
@enduml

