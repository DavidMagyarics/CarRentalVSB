1.0;" x1="362.5" x2="403.5" y1="688.3516" y2="688.3516"/><polygon fill="#A80036" points="372.5,684.3516,362.5,688.3516,372.5,692.3516,368.5,688.3516" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="175" x="368.5" y="670.2856">reload the list (UC6 / UC10)</text><polygon fill="#A80036" points="93.5,703.3516,83.5,707.3516,93.5,711.3516,89.5,707.3516" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="87.5" x2="360.5" y1="707.3516" y2="707.3516"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="255" x="99.5" y="720.4185">reservation cancelled, or error message</text><!--MD5=[5f96c08451ad74ec621cbe3b7adef404]
@startuml sequence-cancel-reservation
skinparam backgroundColor white
skinparam responseMessageBelowArrow true
skinparam maxMessageSize 260
title Sequence — Cancel reservation (UC5)
actor "User\n(Customer or Admin)" as User
boundary ":WebApp" as Web
control ":ReservationService" as Res
control ":AuthService" as Auth
database ":Database" as DB
entity "r : Reservation" as R

User -> Web : cancelReservation(id)
Web -> Res : cancel_reservation(token, id)\n[POST /reservations/{id}/cancel]
Res -> Auth : get_current_user(token)
Auth - -> Res : user : User
Res -> DB : query(Reservation, id)
DB - -> Res : r (404 if none)
Res -> R : get owner, status, start_date
R - -> Res : values

alt r is not the user's and the user is not an admin
  Res - -> Web : 403 "Tato rezervace vám nepatří"
else r.status = CANCELLED
  Res - -> Web : 409 "Rezervace je již zrušena"
else r.status = CONFIRMED and r.start_date has passed
  Res - -> Web : 409 "Potvrzenou rezervaci nelze zrušit\npoté, co již začal termín výpůjčky"
else can be cancelled
  Res -> R : status = CANCELLED
  Res -> DB : save(r)
  Res - -> Web : 200 OK r
  Web -> Web : reload the list (UC6 / UC10)
end

Web - -> User : reservation cancelled, or error message
@enduml

