31">Notification Service</text><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="86" x="886" y="29.4531">Customer</text><line style="stroke: #000000; stroke-width: 2.0;" x1="10" x2="10" y1="12.7451" y2="625.8701"/><line style="stroke: #000000; stroke-width: 2.0;" x1="240" x2="240" y1="12.7451" y2="625.8701"/><line style="stroke: #000000; stroke-width: 2.0;" x1="805.5" x2="805.5" y1="12.7451" y2="625.8701"/><line style="stroke: #000000; stroke-width: 2.0;" x1="1057.5" x2="1057.5" y1="12.7451" y2="625.8701"/><!--MD5=[d26497e0c4015b8e30f978a5ace35fbb]
@startuml activity-send-notification
skinparam backgroundColor white

|System|
start
:Reservation was set to\nCONFIRMED by the admin (UC8);
:Call send_confirmation\n(reservation, customer);

|Notification Service|
if (SMTP configured?\n(SMTP_HOST in backend/.env)) then (yes)
  :Compose e-mail\n(reservation no., dates,\ntotal price);
  if (E-mail sent successfully?) then (yes)
    :Log "confirmation\ne-mail sent";
  else (no)
    :Log the error\n(the reservation stays\nCONFIRMED);
  endif
else (no)
  :Log the notification\n(LoggingNotificationService,\nno e-mail is sent);
endif

|Customer|
:See the reservation as CONFIRMED\nin "My reservations"\n(+ confirmation e-mail,\nif one was sent);
stop
@enduml

