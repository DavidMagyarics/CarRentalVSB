ke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="163" x="212" y="896.2778">All reservations of the car</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="173" x="212" y="911.4106">are deleted together with it</text><polygon fill="#A80036" points="58.5,928.4766,48.5,932.4766,58.5,936.4766,54.5,932.4766" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="52.5" x2="200.5" y1="932.4766" y2="932.4766"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="101" x="64.5" y="945.5435">204 No Content</text><!--MD5=[be281def1fa57a4fec9c011f0a0c9003]
@startuml sequence-manage-fleet
skinparam backgroundColor white
skinparam responseMessageBelowArrow true
skinparam maxMessageSize 260
title Sequence — Manage fleet (UC9)
actor Admin
participant ":FleetService" as Fleet
participant "admin : User" as A
participant "newCar : Car" as N
participant "c : Car" as C

note over Fleet, A
  Every operation first checks admin.is_admin() —
  a non-admin gets 403.
end note

alt Add a car
  Admin -> Fleet : create_car(data)\n[POST /cars/]
  Fleet -> A : is_admin()
  A - -> Fleet : true
  Fleet -> Fleet : get_branch(data.branch_id)
  note right of Fleet : b : Branch (404 if it does not exist)
  create N
  Fleet -> N : <<create>> (brand, model, plate,\nprices, category, ..., b)
  Fleet - -> Admin : 201 Created newCar
else Edit a car
  Admin -> Fleet : update_car(id, data)\n[PUT /cars/{id}]
  Fleet -> A : is_admin()
  A - -> Fleet : true
  Fleet -> Fleet : get_car(id)
  Fleet -> C : update(data)
  Fleet - -> Admin : 200 OK c
else Delete a car
  Admin -> Fleet : delete_car(id)\n[DELETE /cars/{id}]
  Fleet -> A : is_admin()
  A - -> Fleet : true
  Fleet -> Fleet : get_car(id)
  Fleet -> C : <<destroy>>
  destroy C
  note right of Fleet
    All reservations of the car
    are deleted together with it
  end note
  Fleet - -> Admin : 204 No Content
end
@enduml

