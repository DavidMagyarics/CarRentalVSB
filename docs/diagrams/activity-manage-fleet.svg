@startuml activity-manage-fleet
skinparam backgroundColor white

|Admin|
start
:Open "Fleet administration";

switch (Which action?)
case ( Add )
  :Fill new car form\n(brand, model, year, plate,\nprices, category, ...);
  |System|
  :Create Car;
case ( Edit )
  |Admin|
  :Pick a car;
  :Edit form fields;
  |System|
  :Update Car;
case ( Delete )
  |Admin|
  :Pick a car;
  :Confirm deletion;
  |System|
  :Delete Car;
endswitch

|Admin|
:See updated fleet list;
stop
@enduml

