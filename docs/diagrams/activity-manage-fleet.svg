@startuml activity-manage-fleet
skinparam backgroundColor white

|Admin|
start
:Open "Fleet administration";

switch (Which action?)
case ( Add )
  :Fill new car form\n(brand, model, year, plate,\nprices, category, ...);
case ( Edit )
  :Pick a car;
  :Edit form fields;
case ( Delete )
  :Pick a car;
  :Confirm deletion;
endswitch

|System|
switch (Which action?)
case ( Add )
  :Create Car;
case ( Edit )
  :Update Car;
case ( Delete )
  :Delete Car;
endswitch

|Admin|
:See updated fleet list;
stop
@enduml

