if" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="65" x="470" y="29.4531">System</text><line style="stroke: #000000; stroke-width: 2.0;" x1="10" x2="10" y1="12.7451" y2="467.542"/><line style="stroke: #000000; stroke-width: 2.0;" x1="352" x2="352" y1="12.7451" y2="467.542"/><line style="stroke: #000000; stroke-width: 2.0;" x1="708" x2="708" y1="12.7451" y2="467.542"/><!--MD5=[b6072e0be0d35cba52107588799419aa]
@startuml activity-manage-fleet
skinparam backgroundColor white

|Admin|
start
:Open "Fleet administration";

if (Which action?) then (Add)
  :Fill new car form\n(brand, model, year, plate,\nprices, category, ...);
  |System|
  :Create Car;
elseif (Edit) then
  :Pick a car;
  :Edit form fields;
  |System|
  :Update Car;
else (Delete)
  :Pick a car;
  :Confirm deletion;
  |System|
  :Delete Car;
endif

|Admin|
:See updated fleet list;
stop
@enduml

