engthAdjust="spacingAndGlyphs" textLength="54" x="605" y="416.2139">u : User</text><line style="stroke: #A80036; stroke-width: 1.0;" x1="325" x2="367" y1="462.6484" y2="462.6484"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="367" x2="367" y1="462.6484" y2="475.6484"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="326" x2="367" y1="475.6484" y2="475.6484"/><polygon fill="#A80036" points="336,471.6484,326,475.6484,336,479.6484,332,475.6484" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="153" x="332" y="457.5825">create_access_token(u)</text><polygon fill="#A80036" points="71,483.6484,61,487.6484,71,491.6484,67,487.6484" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="65" x2="324" y1="487.6484" y2="487.6484"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="151" x="77" y="500.7153">201 Created {token, u}</text><!--MD5=[65caf46a13003e93ed595583c47e4990]
@startuml sequence-register
skinparam backgroundColor white
skinparam responseMessageBelowArrow true
skinparam maxMessageSize 260
title Sequence — Register (UC1)
actor Customer
participant ":AuthService" as Auth
participant "u : User" as U

Customer -> Auth : create_user(name, email, password)\n[POST /auth/register]
note right of Auth
  Invalid e-mail or password
  shorter than 6 characters → 422
end note
Auth -> Auth : get_user_by_email(email)

alt e-mail already registered
  Auth - -> Customer : 409 "Tento e-mail je již zaregistrován"
else e-mail is free
  Auth -> Auth : hash_password(password)
  create U
  Auth -> U : <<create>> (name, email, password_hash,\nrole = CUSTOMER)
  Auth -> Auth : create_access_token(u)
  Auth - -> Customer : 201 Created {token, u}
end
@enduml

