ine style="stroke: #000000; stroke-width: 2.0;" x1="437" x2="437" y1="12.7451" y2="505.2959"/><!--MD5=[f720da987afa6b1e0960c5be95977362]
@startuml activity-browse-cars
skinparam backgroundColor white

|Customer|
start
:Open the app;

|System|
:List all cars;

|Customer|
:See car grid\n(photo, price/day, price/hour, specs);
if (Apply a filter?\n(category, transmission,\nfuel type, price range)) then (yes)
  |System|
  :Query cars matching\nthe selected filters;
else (no)
endif

|Customer|
:See (updated) car grid;
stop
@enduml

