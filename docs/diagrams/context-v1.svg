@startuml context-v1
left to right direction
skinparam backgroundColor white

actor "Customer" as customer
actor "Admin" as admin
rectangle "CarRentalVSB\n(web application)" as app

customer - -> app : browses cars, creates reservations (HTTPS)
admin - -> app : manages fleet and reservations (HTTPS)
@enduml

