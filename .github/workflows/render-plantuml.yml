name: Render PlantUML diagrams

on:
  push:
    branches: [main]
    paths:
      - "docs/diagrams/**.puml"
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install PlantUML
        run: sudo apt-get update && sudo apt-get install -y plantuml

      - name: Render diagrams to SVG
        run: |
          for f in docs/diagrams/*.puml; do
            plantuml -tsvg "$f"
          done

      - name: Force solid white background (PlantUML SVG output has none)
        run: |
          python3 - <<'PY'
          import glob, re

          for path in glob.glob("docs/diagrams/*.svg"):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = re.sub(
                  r"(<svg[^>]*>)",
                  r'\1<rect width="100%" height="100%" fill="white"/>',
                  content,
                  count=1,
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          PY

      - name: Commit rendered diagrams
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: re-render PlantUML diagrams [skip ci]"
          file_pattern: "docs/diagrams/*.svg"
